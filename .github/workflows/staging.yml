name: Publish staging images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-images
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Backend integration tests
        working-directory: backend
        run: |
          npm ci
          npm test

  publish:
    name: Build and publish staging containers
    runs-on: ubuntu-latest
    needs: verify
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image namespace
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          namespace=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: staging
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}-frontend:staging
            ghcr.io/${{ steps.image.outputs.namespace }}-frontend:sha-${{ github.sha }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: staging
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}-backend:staging
            ghcr.io/${{ steps.image.outputs.namespace }}-backend:sha-${{ github.sha }}
