name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  docker:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        env:
          CINEBOOK_AUTH_SECRET: ci-only-auth-secret
          TICKET_SECRET: ci-only-ticket-secret
          ADMIN_EMAIL: admin@cinebook.test
          ADMIN_PASSWORD: ci-only-admin-password
          MONGODB_ROOT_USERNAME: cinebook-ci
          MONGODB_ROOT_PASSWORD: ci-only-mongodb-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Run frontend and MongoDB-backed integration tests
        run: |
          docker compose -f docker-compose.test.yml run --build --rm frontend-test
          docker compose -f docker-compose.test.yml run --build --rm backend-test
      - name: Build staging frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: staging
          push: false
      - name: Build staging backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: staging
          push: false
