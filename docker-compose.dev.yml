name: cinebook-dev

services:
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: cinebook
      MONGO_INITDB_ROOT_PASSWORD: local-only-mongo-password
    volumes:
      - cinebook-dev-mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      PORT: 5001
      CINEBOOK_DATA_DIR: /app/data
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/cinebook}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cinebook}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-cinebook}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-local-only-mongo-password}
      CINEBOOK_AUTH_SECRET: local-development-only-change-this-secret
      TICKET_SECRET: local-development-ticket-secret-change-this
      ADMIN_EMAIL: admin@cinebook.local
      ADMIN_PASSWORD: change-this-admin-password
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/server.js:/app/backend/server.js
      - ./backend/service-runner.js:/app/backend/service-runner.js
      - ./backend/services:/app/backend/services
      - ./backend/lib:/app/backend/lib
      - cinebook-dev-data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_API_URL: /api
      CINEBOOK_PROXY_TARGET: http://backend:5001
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend-node-modules:
  cinebook-dev-mongo:
  cinebook-dev-data:
